name: tests

# The suite is hermetic: every target is a localhost fixture, so nothing here
# ever touches a third party host.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"                     # weekly: the oracle asserts real browser behaviour, which drifts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    # Fast and deterministic: no browser involved, so it can afford to run on
    # every interpreter DSXS claims to support.
    name: suite (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 10

    env:
      DSXS_SKIP_ORACLE: "1"

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - python-version: "3.9"
            os: ubuntu-24.04                # no 3.9 build exists for newer runner images

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Report the environment
        run: |
          python -VV
          openssl version

      - name: Run the regression suite
        run: python -m unittest discover -s tests -v

  oracle:
    # Cross-checks every verdict against a real browser. Environment bound and
    # an order of magnitude slower, so it runs once instead of per interpreter.
    name: browser oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Cold-starting browsers contend for the runner's few cores; two at a
      # time keeps every launch comfortably inside the per-render timeout.
      DSXS_ORACLE_JOBS: 2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Require a working headless browser
        # Two failure modes to rule out before the suite starts: no browser at
        # all (the oracle tests would skip themselves and quietly turn the build
        # green), and a browser that cannot actually render here. The selftest
        # renders a trivial page and reports whatever the browser said, so a
        # broken one fails in seconds instead of hanging until the timeout.
        run: >-
          python -c "import sys; sys.path.insert(0, 'tests'); import browser;
          sys.exit('no Chromium/Chrome found: refusing to run with the oracle disabled')
          if not browser.available() else print(browser.selftest())"

      - name: Run the regression suite, oracle included
        run: python -m unittest discover -s tests -v
